{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4>Ручной ввод кампаний</h4>
            <div>
                <button id="saveData" class="btn btn-success">
                    <i class="bi bi-save"></i> Сохранить
                </button>
            </div>
        </div>
        <div class="card-body">
            <div id="hot"></div>
        </div>
        <div class="card-footer">
            <p class="text-muted small">
                Заполните таблицу данными. Для сохранения нажмите кнопку "Сохранить".
                Пустые строки будут автоматически игнорироваться.
            </p>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
<script src="{{ url_for('static', filename='js/handsontable-init.js') }}"></script>
{% endblock %}
