{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">
                    <i class="bi bi-bar-chart"></i> Оптимизация заголовков Keitaro
                </h5>
            </div>
            <div class="card-body">
                <!-- Статус и управление -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">Автоматическая оптимизация</h6>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="autoOptimizationSwitch">
                                    <label class="form-check-label" for="autoOptimizationSwitch">
                                        Автоматическая оптимизация
                                    </label>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Интервал (часы):</label>
                                    <input type="number" class="form-control" id="optimizationInterval" value="4" min="1" max="24">
                                </div>
                                <button class="btn btn-primary" onclick="saveOptimizationSettings()">
                                    <i class="bi bi-save"></i> Сохранить настройки
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">Ручное управление</h6>
                                <div class="mb-3">
                                    <label class="form-label">Выберите кампанию:</label>
                                    <select class="form-select" id="campaignSelect">
                                        <option value="">Загрузка кампаний...</option>
                                    </select>
                                </div>
                                <button class="btn btn-success mb-2" onclick="runOptimization()" id="runOptimizationBtn">
                                    <i class="bi bi-play-circle"></i> Запустить оптимизацию
                                </button>
                                <button class="btn btn-info" onclick="loadCampaignStatus()" id="refreshStatusBtn">
                                    <i class="bi bi-arrow-clockwise"></i> Обновить статус
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Статистика кампании -->
                <div class="card mb-4" id="campaignStatsCard" style="display: none;">
                    <div class="card-header">
                        <h6 class="card-title mb-0">Статистика кампании: <span id="campaignName"></span></h6>
                    </div>
                    <div class="card-body">
                        <div class="row" id="campaignStats">
                            <!-- Статистика будет загружена здесь -->
                        </div>
                    </div>
                </div>

                <!-- Таблица потоков -->
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title mb-0">Потоки кампании</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="streamsTable">
                                <thead>
                                    <tr>
                                        <th>Название потока</th>
                                        <th>Текущий вес</th>
                                        <th>Конверсии</th>
                                        <th>Затраты</th>
                                        <th>Доход</th>
                                        <th>CPA</th>
                                        <th>ROI</th>
                                        <th>Рекомендуемый вес</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Данные будут загружены здесь -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Глобальные переменные
let currentCampaignId = '';
let optimizationSettings = {
    auto: false,
    interval: 4
};

// Загрузка при старте
$(document).ready(function() {
    loadCampaigns();
    loadOptimizationSettings();
});

// Загрузка списка кампаний
function loadCampaigns() {
    $.ajax({
        url: '/api/campaigns',
        type: 'GET',
        success: function(response) {
            if (response.success) {
                const select = $('#campaignSelect');
                select.empty();
                select.append('<option value="">Выберите кампанию</option>');
                
                response.data.forEach(campaign => {
                    select.append(`<option value="${campaign.campaign_id}">${campaign.name}</option>`);
                });
            }
        },
        error: function(error) {
            console.error('Ошибка загрузки кампаний:', error);
        }
    });
}

// Загрузка настроек оптимизации
function loadOptimizationSettings() {
    $.ajax({
        url: '/api/settings',
        type: 'GET',
        success: function(response) {
            if (response.success) {
                optimizationSettings = {
                    auto: response.config.auto_headline_optimization || false,
                    interval: response.config.headline_optimization_interval || 4
                };
                
                $('#autoOptimizationSwitch').prop('checked', optimizationSettings.auto);
                $('#optimizationInterval').val(optimizationSettings.interval);
            }
        }
    });
}

// Сохранение настроек оптимизации
function saveOptimizationSettings() {
    const settings = {
        auto_headline_optimization: $('#autoOptimizationSwitch').is(':checked'),
        headline_optimization_interval: parseInt($('#optimizationInterval').val())
    };

    $.ajax({
        url: '/api/settings',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(settings),
        success: function(response) {
            if (response.success) {
                showAlert('Настройки сохранены успешно!', 'success');
                loadOptimizationSettings();
            } else {
                showAlert('Ошибка сохранения настроек: ' + response.error, 'error');
            }
        },
        error: function(error) {
            showAlert('Ошибка сохранения настроек', 'error');
        }
    });
}

// Запуск оптимизации
function runOptimization() {
    const campaignId = $('#campaignSelect').val();
    if (!campaignId) {
        showAlert('Выберите кампанию для оптимизации', 'warning');
        return;
    }

    $('#runOptimizationBtn').prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> Оптимизация...');

    $.ajax({
        url: '/api/headline_optimization/run',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ campaign_id: campaignId }),
        success: function(response) {
            $('#runOptimizationBtn').prop('disabled', false).html('<i class="bi bi-play-circle"></i> Запустить оптимизацию');
            
            if (response.success) {
                showAlert(response.message, 'success');
                // Загружаем обновленный статус
                loadCampaignStatus();
            } else {
                showAlert('Ошибка оптимизации: ' + response.error, 'error');
            }
        },
        error: function(error) {
            $('#runOptimizationBtn').prop('disabled', false).html('<i class="bi bi-play-circle"></i> Запустить оптимизацию');
            showAlert('Ошибка запуска оптимизации', 'error');
        }
    });
}

// Загрузка статуса кампании
function loadCampaignStatus() {
    const campaignId = $('#campaignSelect').val();
    if (!campaignId) {
        showAlert('Выберите кампанию', 'warning');
        return;
    }

    // Получаем название кампании для отображения
    const campaignName = $('#campaignSelect option:selected').text();
    $('#campaignName').text(campaignName);
    
    currentCampaignId = campaignId;
    $('#refreshStatusBtn').prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> Загрузка...');

    $.ajax({
        url: `/api/headline_optimization/status?campaign_id=${campaignId}`,
        type: 'GET',
        success: function(response) {
            $('#refreshStatusBtn').prop('disabled', false).html('<i class="bi bi-arrow-clockwise"></i> Обновить статус');
            
            if (response.success) {
                displayCampaignStats(response);
                displayStreamsTable(response.streams);
                $('#campaignStatsCard').show();
            } else {
                showAlert('Ошибка загрузки статуса: ' + response.error, 'error');
                $('#campaignStatsCard').hide();
            }
        },
        error: function(error) {
            $('#refreshStatusBtn').prop('disabled', false).html('<i class="bi bi-arrow-clockwise"></i> Обновить статус');
            showAlert('Ошибка загрузки статуса кампании', 'error');
            $('#campaignStatsCard').hide();
        }
    });
}

// Отображение статистики кампании
function displayCampaignStats(response) {
    const stats = response.streams.reduce((acc, stream) => {
        acc.totalConversions += stream.conversions;
        acc.totalCost += stream.cost;
        acc.totalRevenue += stream.revenue;
        return acc;
    }, { totalConversions: 0, totalCost: 0, totalRevenue: 0 });

    const totalCPA = stats.totalCost / (stats.totalConversions || 1);
    const totalROI = ((stats.totalRevenue - stats.totalCost) / (stats.totalCost || 1)) * 100;

    const campaignName = $('#campaignSelect option:selected').text();
    $('#campaignName').text(campaignName);

    $('#campaignStats').html(`
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body text-center">
                    <h6 class="card-title">Конверсии</h6>
                    <h3 class="text-primary">${stats.totalConversions}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body text-center">
                    <h6 class="card-title">Затраты</h6>
                    <h3 class="text-danger">$${stats.totalCost.toFixed(2)}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body text-center">
                    <h6 class="card-title">Доход</h6>
                    <h3 class="text-success">$${stats.totalRevenue.toFixed(2)}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body text-center">
                    <h6 class="card-title">ROI</h6>
                    <h3 class="${totalROI >= 0 ? 'text-success' : 'text-danger'}">${totalROI.toFixed(1)}%</h3>
                </div>
            </div>
        </div>
    `);
}

// Отображение таблицы потоков
function displayStreamsTable(streams) {
    const tbody = $('#streamsTable tbody');
    tbody.empty();

    // Сортируем потоки по ROI (лучшие сначала)
    streams.sort((a, b) => b.roi - a.roi);

    streams.forEach((stream, index) => {
        const recommendedWeight = calculateRecommendedWeight(index, streams.length);
        const row = `
            <tr>
                <td>${stream.name}</td>
                <td><span class="badge bg-primary">${stream.weight}%</span></td>
                <td>${stream.conversions}</td>
                <td>$${stream.cost.toFixed(2)}</td>
                <td>$${stream.revenue.toFixed(2)}</td>
                <td>$${stream.cpa.toFixed(2)}</td>
                <td>
                    <span class="badge ${stream.roi >= 0 ? 'bg-success' : 'bg-danger'}">
                        ${stream.roi.toFixed(1)}%
                    </span>
                </td>
                <td>
                    <span class="badge bg-info">${recommendedWeight}%</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="updateStreamWeight('${stream.id}', ${recommendedWeight})">
                        <i class="bi bi-arrow-up-circle"></i> Применить
                    </button>
                </td>
            </tr>
        `;
        tbody.append(row);
    });

    // Инициализируем DataTables если еще не инициализирована
    if (!$.fn.DataTable.isDataTable('#streamsTable')) {
        $('#streamsTable').DataTable({
            ordering: true,
            pageLength: 10,
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ru.json'
            }
        });
    }
}

// Расчет рекомендуемого веса
function calculateRecommendedWeight(index, totalStreams) {
    const baseWeight = 100 / totalStreams;
    
    if (index === 0) { // Лучший поток
        return Math.min(Math.round(baseWeight * 2), 70);
    } else if (index === totalStreams - 1) { // Худший поток
        return Math.max(Math.round(baseWeight / 2), 5);
    } else {
        return Math.round(baseWeight);
    }
}

// Обновление веса потока
function updateStreamWeight(streamId, newWeight) {
    $.ajax({
        url: '/api/headline_optimization/update_weight',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            stream_id: streamId,
            new_weight: newWeight
        }),
        success: function(response) {
            if (response.success) {
                showAlert('Вес потока успешно обновлен!', 'success');
                // Перезагружаем статус
                loadCampaignStatus();
            } else {
                showAlert('Ошибка обновления веса: ' + response.error, 'error');
            }
        },
        error: function(error) {
            showAlert('Ошибка обновления веса потока', 'error');
        }
    });
}

// Вспомогательная функция для показа уведомлений
function showAlert(message, type) {
    const alertClass = type === 'success' ? 'alert-success' : 
                      type === 'error' ? 'alert-danger' : 
                      type === 'warning' ? 'alert-warning' : 'alert-info';
    
    const alert = `
        <div class="alert ${alertClass} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    $('.container-fluid').prepend(alert);
    
    // Автоматическое закрытие через 5 секунд
    setTimeout(() => {
        $('.alert').alert('close');
    }, 5000);
}

// Обработчик изменения выбора кампании
$('#campaignSelect').change(function() {
    if ($(this).val()) {
        loadCampaignStatus();
    } else {
        $('#campaignStatsCard').hide();
        $('#streamsTable tbody').empty();
    }
});
</script>
{% endblock %}
