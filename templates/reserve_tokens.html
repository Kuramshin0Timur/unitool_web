<!-- reserve_tokens.html - обновленная таблица -->
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-key"></i> Управление токенами</h2>
        <div>
            <button class="btn btn-primary me-2" onclick="loadCombinedTokensTable()">
                <i class="bi bi-arrow-repeat"></i> Обновить
            </button>
            <button class="btn btn-success" onclick="checkAllLimits()">
                <i class="bi bi-speedometer2"></i> Проверить лимиты
            </button>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5><i class="bi bi-table"></i> Таблица токенов и лимитов</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="tokensTable">
                    <thead>
                        <tr>
                            <th>KING</th>
                            <th>Токен доступа</th>
                            <th>ID Аккаунтов</th>
                            <th>Лимит запросов</th>
                            <th>Использовано</th>
                            <th>Процент использования</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Данные будут загружены через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reserve_tokens.js') }}"></script>
{% endblock %}
