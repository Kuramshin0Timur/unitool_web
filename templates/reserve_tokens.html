{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-key"></i> Управление резервными токенами</h2>
    
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5><i class="bi bi-plus-circle"></i> Добавить резервный токен</h5>
        </div>
        <div class="card-body">
            <form id="addTokenForm" class="row g-3">
                <div class="col-md-4">
                    <label for="kingInput" class="form-label">KING</label>
                    <input type="text" class="form-control" id="kingInput" placeholder="Введите KING" required>
                </div>
                <div class="col-md-6">
                    <label for="tokenInput" class="form-label">Токен доступа</label>
                    <input type="text" class="form-control" id="tokenInput" placeholder="Введите токен Facebook" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus"></i> Добавить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5><i class="bi bi-list"></i> Список резервных токенов</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>KING</th>
                            <th>Токен</th>
                            <th>Добавлен</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tokensTable">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1"></i>
                                <p class="mt-2">Нет резервных токенов</p>
                                <small>Добавьте токены через форму выше</small>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reserve_tokens.js') }}"></script>
{% endblock %}
