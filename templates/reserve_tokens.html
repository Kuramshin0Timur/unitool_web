{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-key"></i> Управление резервными токенами и лимитами</h2>
    
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5><i class="bi bi-plus-circle"></i> Добавить резервный токен</h5>
        </div>
        <div class="card-body">
            <form id="addTokenForm" class="row g-3">
                <div class="col-md-3">
                    <label for="kingInput" class="form-label">KING</label>
                    <input type="text" class="form-control" id="kingInput" placeholder="Введите KING" required>
                </div>
                <div class="col-md-5">
                    <label for="tokenInput" class="form-label">Токен доступа</label>
                    <input type="text" class="form-control" id="tokenInput" placeholder="Введите токен Facebook" required>
                </div>
                <div class="col-md-4">
                    <label for="accountIdsInput" class="form-label">ID Аккаунтов (через запятую)</label>
                    <input type="text" class="form-control" id="accountIdsInput" placeholder="act_123, act_456">
                </div>
                <div class="col-md-12">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus"></i> Добавить токен
                    </button>
                    <button type="button" class="btn btn-info ms-2" onclick="checkAllLimits()">
                        <i class="bi bi-arrow-repeat"></i> Проверить все лимиты
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <h5><i class="bi bi-list"></i> Токены и лимиты аккаунтов</h5>
            <div>
                <button class="btn btn-sm btn-light" onclick="loadReserveTokens()">
                    <i class="bi bi-arrow-repeat"></i> Обновить
                </button>
            </div>
        </div>
        <div class="card-body">
            <div id="tokensAccordion">
                <div class="text-center py-4">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                    <p class="mt-2">Загрузка токенов...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для добавления аккаунта -->
<div class="modal fade" id="addAccountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить аккаунт к токену</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addAccountForm">
                    <input type="hidden" id="modalToken">
                    <input type="hidden" id="modalKing">
                    <div class="mb-3">
                        <label for="modalAccountId" class="form-label">ID Аккаунта</label>
                        <input type="text" class="form-control" id="modalAccountId" required 
                               placeholder="act_1234567890">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="addAccountToToken()">Добавить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reserve_tokens.js') }}"></script>
{% endblock %}
