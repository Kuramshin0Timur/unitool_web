{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div id="alertsContainer"></div>
    
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Управление компаниями</h4>
            <div class="d-flex gap-2">
                <div class="input-group" style="width: 300px;">
                    <input type="text" id="globalSearch" class="form-control" placeholder="Поиск по всем столбцам...">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearch">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <button id="refreshCampaigns" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-repeat"></i> Обновить
                </button>
            </div>
        </div>
        <div class="card-body">
            <table id="campaignsTable" class="table table-striped table-hover" style="width:100%">
                <thead>
                    <tr>
                        <th>KING</th>
                        <th>Название</th>
                        <th>Статус</th>
                        <th>ID аккаунта</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Данные загружаются через AJAX -->
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <a href="{{ url_for('add_campaign_page') }}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Добавить компанию
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Сначала подключаем jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Затем подключаем DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css">

<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>

<!-- И только потом наш скрипт -->
<script src="{{ url_for('static', filename='js/campaigns.js') }}"></script>
{% endblock %}
