{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-12">
    <h2>Управление AdSets</h2>
    <a href="{{ url_for('add_adset_page') }}" class="btn btn-success mb-3">
      <i class="bi bi-plus-circle"></i> Добавить AdSet
    </a>

    <div class="card mb-3">
      <div class="card-header">
        <div class="row g-2">
          <div class="col-md-3">
            <select id="statusFilter" class="form-select">
              <option value="all">Все</option>
              <option value="ACTIVE">Активные</option>
              <option value="PAUSED">Пауза</option>
              <option value="DISABLED">Отключенные</option>
              <option value="ARCHIVED">Архив</option>
            </select>
          </div>
          <div class="col-md-6">
            <input type="text" id="nameSearch" class="form-control" placeholder="Поиск по названию...">
          </div>
          <div class="col-md-3 d-flex justify-content-end">
            <button id="columnManagerBtn" class="btn btn-outline-secondary">
              <i class="bi bi-sliders"></i> Управление колонками
            </button>
          </div>
        </div>
      </div>
<!-- Убираем колонки авто-бюджета -->
<table id="adsetsTable" class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Выбрать</th>
            <th>Название</th>
            <th>Статус</th>
            <th>uCPC</th>
            <th>CPC (Facebook)</th>
            <th>Spend</th>
            <th>CPA</th>
            <th>Leads</th>
            <th>GEO</th>
            <th>KING</th>
            <th>Бюджет</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        <!-- Данные загружаются через JS -->
    </tbody>
</table>

<!-- Убираем кнопку авто-бюджета -->
<div class="card-footer d-flex flex-wrap gap-2 action-buttons">
    <button id="pauseBtn" class="btn btn-danger">
        <i class="bi bi-pause-fill"></i> Отключить выбранные
    </button>
    <button id="resumeBtn" class="btn btn-success">
        <i class="bi bi-play-fill"></i> Включить выбранные
    </button>
    <button id="setBudgetBtn" class="btn btn-primary">
        <i class="bi bi-currency-dollar"></i> Установить бюджет
    </button>
    <button id="syncAllBtn" class="btn btn-outline-primary ms-auto">
        <i class="bi bi-arrow-repeat"></i> Обновить все данные
    </button>
</div>
<div class="input-group mb-3" style="max-width: 200px;">
  <span class="input-group-text">$</span>
  <input type="number" id="budgetInput" class="form-control" placeholder="Бюджет" min="1" step="0.01">
</div>

<!-- Логи -->
<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Логи</h5>
        <button id="autoControlBtn" class="btn btn-warning btn-sm">
          <i class="bi bi-gear-fill"></i> Запустить автоконтроль
        </button>
      </div>
      <div class="card-body log-container" style="height: 200px; overflow-y: auto;">
        <div id="logContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно управления колонками -->
<div class="modal fade" id="columnManagerModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Настройка колонок</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Колонка</th>
              <th>Показать</th>
              <th>Ширина (px)</th>
            </tr>
          </thead>
          <tbody id="columnSettingsBody">
            <!-- JS заполняет содержимое -->
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button id="applyColumnSettings" class="btn btn-primary">Применить</button>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно настроек бюджета -->
<div class="modal fade" id="budgetSettingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="budgetSettingsTitle">Настройки авто-бюджета</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="budgetAdsetId">
        
        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="autoBudgetIncrease">
            <label class="form-check-label" for="autoBudgetIncrease">
              Авто-увеличение бюджета
            </label>
          </div>
        </div>
        
        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="autoBudgetDecrease">
            <label class="form-check-label" for="autoBudgetDecrease">
              Авто-уменьшение бюджета
            </label>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="maxBudget" class="form-label">Макс. бюджет ($)</label>
            <input type="number" class="form-control" id="maxBudget" step="0.01" min="0">
          </div>
          <div class="col-md-6 mb-3">
            <label for="minBudget" class="form-label">Мин. бюджет ($)</label>
            <input type="number" class="form-control" id="minBudget" step="0.01" min="0">
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="budgetIncreaseStep" class="form-label">Шаг увеличения</label>
            <input type="number" class="form-control" id="budgetIncreaseStep" step="0.1" min="1.0" value="1.2">
          </div>
          <div class="col-md-6 mb-3">
            <label for="budgetDecreaseStep" class="form-label">Шаг уменьшения</label>
            <input type="number" class="form-control" id="budgetDecreaseStep" step="0.1" max="1.0" value="0.8">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="saveBudgetSettings()">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/adsets.js') }}"></script>
{% endblock %}
