{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 text-center">
            <h2>Добро пожаловать, {{ username }}!</h2>
            <p class="lead">Вы успешно вошли в систему управления рекламными компаниями</p>
            
            <div class="mt-4">
                <a href="{{ url_for('campaigns') }}" class="btn btn-primary btn-lg me-3">
                    <i class="bi bi-megaphone"></i> Управление компаниями
                </a>
                <a href="{{ url_for('adsets') }}" class="btn btn-success btn-lg">
                    <i class="bi bi-collection"></i> Управление AdSets
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
